<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>소각로 운영관리</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}*{box-sizing:border-box}body{margin:0;background:#151515;color:#f6f6f6;font-size:15px}main{max-width:760px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 12px calc(90px + env(safe-area-inset-bottom))}h1{font-size:29px;margin:10px 6px 4px}p.sub{color:#aaa;margin:0 6px 27px}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.tabs,.actions,.nav,.toolbar,.headrow{display:flex;gap:8px}.tabs button{flex:1;padding:14px 3px;border:0;border-radius:13px;background:#353535;font-weight:700}.tabs .active,.primary{background:#2877e9!important;color:#fff}.toolbar{align-items:center;justify-content:space-between;margin:25px 4px 14px}.toolbar strong{font-size:23px}.toolbar button,.smallbtn{background:#333;border:0;border-radius:11px;padding:11px 15px;font-weight:700}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{text-align:center;margin-bottom:8px}.week span{padding:7px 0;font-weight:600}.week span:first-child,.sun{color:#ff666d}.week span:last-child,.sat{color:#4997ff}.calendar{border:1px solid #454545;border-radius:14px;overflow:hidden}.day{background:#191919;min-width:0;min-height:89px;border:0;border-right:1px solid #404040;border-bottom:1px solid #404040;padding:6px 2px;display:flex;align-items:center;flex-direction:column;gap:5px}.day:nth-child(7n){border-right:0}.day.other{background:#161616}.day.selected{background:#164c9b}.day.today .num{outline:1px solid #74a9ff;border-radius:50%}.num{font-size:17px;font-weight:700;padding:1px 5px}.event{display:block;width:100%;border-radius:5px;padding:3px 2px;color:#111;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.event.operation{background:#9ed8ae}.event.stop{background:#ffa3ad}.event.maintenance{background:#a3e4f5}.event.check{background:#ffe077}.event.work{background:#b8a3ff}.more{font-size:10px;color:#bbb}.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;color:#ccc;font-size:12px;margin:15px 0 22px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.panel{background:#242424;border:1px solid #454545;border-radius:18px;padding:17px;margin:16px 0}.headrow{align-items:center;justify-content:space-between}.headrow h2{font-size:19px;margin:0}.primary{border:0;border-radius:11px;padding:11px 15px;font-weight:700}.entry{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:#292929;border:1px solid #555;border-radius:12px;padding:13px;margin-top:12px}.entry .body{flex:1;min-width:0}.entry .body strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry small{color:#aaa}.tag{border-radius:6px;background:#c7e2ff;color:#123967;font-weight:700;padding:5px;font-size:12px}.muted{color:#aaa}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:15px}.actions button{background:#343434;border:1px solid #555;border-radius:12px;padding:13px 2px;font-size:12px;min-height:72px}.actions b{display:block;font-size:21px;margin-bottom:6px}.nav{position:fixed;bottom:0;left:0;right:0;background:#202020;border-top:1px solid #444;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:2}.nav button{border:0;background:transparent;font-size:12px;padding:7px 4px;border-radius:9px}.nav button.active{background:#246ed6}.nav b{display:block;font-size:21px}.overlay{position:fixed;inset:0;background:#000b;z-index:5;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:#282828;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:760px;max-height:92vh;overflow:auto}.sheet h2{margin:0 0 15px}.sheet label{display:block;margin:12px 0 5px;color:#ddd;font-weight:600}.sheet input,.sheet select,.sheet textarea{display:block;width:100%;border:1px solid #666;background:#fff;color:#111;border-radius:10px;padding:12px;min-height:45px}.sheet textarea{min-height:90px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheetfooter{display:flex;gap:9px;margin-top:18px}.sheetfooter button{flex:1;padding:13px;border-radius:10px;border:0;background:#444}.sheetfooter .primary{flex:2}.hidden{display:none!important}@media(max-width:380px){.day{min-height:76px}.event{font-size:9px}.actions button{font-size:11px}.toolbar strong{font-size:20px}}
</style></head><body><main><h1>소각로 운영관리</h1><p class="sub">1~4호기 업무 · 가동 이력 · 보수 이력</p><div class="tabs"><button data-tab="work" class="active">일정·업무</button><button data-tab="operation">가동 이력</button><button data-tab="maintenance">보수 이력</button></div><div class="toolbar"><button id="prev" aria-label="이전 달">❮</button><strong id="monthLabel"></strong><div><button id="today">오늘</button> <button id="next" aria-label="다음 달">❯</button></div></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="calendar" id="calendar"></div><div class="legend"><span><i class="dot" style="background:#9ed8ae"></i>가동/재가동</span><span><i class="dot" style="background:#ffa3ad"></i>정지</span><span><i class="dot" style="background:#ffe077"></i>점검</span><span><i class="dot" style="background:#a3e4f5"></i>보수</span><span><i class="dot" style="background:#b8a3ff"></i>업무</span></div><section class="panel"><div class="headrow"><h2 id="dayTitle"></h2><button class="primary" id="addDay">＋ 일정 등록</button></div><div id="dayItems"></div></section><section class="panel"><h2 style="margin:0">빠른 등록</h2><div class="actions"><button data-add="work"><b>▣</b>업무 등록</button><button data-add="operation"><b>▶</b>가동 등록</button><button data-add="maintenance"><b>🔧</b>보수 등록</button><button id="allHistory"><b>☷</b>이력 조회</button></div></section><section class="panel">
<div class="headrow"><h2>아이폰 위젯</h2><button id="updateWidget" type="button">위젯 업데이트</button></div>
<details style="margin-top:10px"><summary>처음 연결하기</summary>
<p>Scriptable에서 새 스크립트를 만들고 아래 코드를 붙여넣으세요. 이름은 <strong>소각로 위젯</strong>으로 저장하세요.</p>
<button id="copyWidget" type="button">위젯 코드 복사</button>
<p>홈 화면을 길게 누르고 편집 → 위젯 추가 → Scriptable을 선택하세요. 중간 크기를 추가한 다음, 위젯 편집 → Script → 소각로 위젯을 선택하세요.</p>
</details>
<button id="copySnapshot" type="button">일정 복사 (수동 연결)</button>
<p class="muted">일정이 바뀌면 위젯 업데이트를 눌러 아이폰에 전달하세요.</p>
</section></main><div class="nav"><button class="active" data-unit="all"><b>⌂</b>홈</button><button data-unit="1"><b>♧</b>1호기</button><button data-unit="2"><b>♧</b>2호기</button><button data-unit="3"><b>♧</b>3호기</button><button data-unit="4"><b>♧</b>4호기</button><button data-unit="history"><b>☷</b>전체 이력</button></div><div class="overlay" id="overlay"><div class="sheet"><h2 id="formTitle">일정 등록</h2><form id="recordForm"><input type="hidden" id="recordId"><label>분류</label><select id="kind"><option value="work">일반업무</option><option value="operation">가동/재가동</option><option value="stop">가동정지</option><option value="check">점검/확인</option><option value="maintenance">보수</option></select><div class="formrow"><div><label>시작일</label><input type="date" id="start" required></div><div><label>종료일</label><input type="date" id="end" required></div></div><div class="formrow"><div><label>호기</label><select id="unit"><option value="all">전체</option><option value="1">1호기</option><option value="2">2호기</option><option value="3">3호기</option><option value="4">4호기</option></select></div><div><label>시간 (선택)</label><input type="time" id="time"></div></div><label>업무명 (달력에 최대 7글자 표시)</label><input id="name" maxlength="100" placeholder="예: 3호기 백필터 차압 확인" required><label>상세 내용</label><textarea id="details" placeholder="작업 내용, 정지 사유, 보수 결과 등을 입력"></textarea><div class="sheetfooter"><button type="button" id="cancel">취소</button><button type="button" id="delete" class="hidden" style="background:#8d3434">삭제</button><button type="submit" class="primary">저장</button></div></form></div></div><script>
(()=>{'use strict';const KEY='incinerator_calendar_records_v1';let records=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))records=v;}catch(e){alert('저장된 데이터를 읽을 수 없습니다. 기존 데이터는 삭제하지 않았습니다.')}const $=id=>document.getElementById(id);const now=new Date();const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let selected=iso(now),view=new Date(now.getFullYear(),now.getMonth(),1),tab='work',unitFilter='all',history=false;const kinds={work:'업무',operation:'가동',stop:'정지',check:'점검',maintenance:'보수'};function save(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){alert('저장에 실패했습니다. 아이폰 저장 공간 또는 Safari 설정을 확인해 주세요.');return false}}function matching(r){return(unitFilter==='all'||unitFilter==='history'||r.unit==='all'||r.unit===unitFilter)&&(!history&&(tab==='work'||(tab==='operation'?(r.kind==='operation'||r.kind==='stop'):r.kind==='maintenance'))||history)}function forDay(date){return records.filter(r=>r.start<=date&&r.end>=date&&matching(r)).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function render(){const yr=view.getFullYear(),mo=view.getMonth();$('monthLabel').textContent=`${yr}년 ${mo+1}월`;const cal=$('calendar');cal.replaceChildren();const first=new Date(yr,mo,1).getDay(),days=new Date(yr,mo+1,0).getDate(),count=Math.ceil((first+days)/7)*7;for(let i=0;i<count;i++){const d=i-first+1,date=iso(new Date(yr,mo,d)),valid=d>=1&&d<=days;const cell=el('button','day'+(!valid?' other':'')+(date===selected?' selected':'')+(date===iso(new Date())?' today':''));cell.type='button';const num=el('span','num'+(i%7===0?' sun':i%7===6?' sat':''),valid?String(d):'');cell.append(num);if(valid){const items=forDay(date);items.slice(0,2).forEach(r=>{const b=el('span','event '+r.kind,r.name.slice(0,7));cell.append(b)});if(items.length>2)cell.append(el('span','more',`+${items.length-2}개`));cell.addEventListener('click',()=>{selected=date;render();});}else cell.disabled=true;cal.append(cell)}const [y,m,d]=selected.split('-').map(Number);const weekday='일월화수목금토'[new Date(y,m-1,d).getDay()];$('dayTitle').textContent=`${m}월 ${d}일 (${weekday}) 일정`;const list=$('dayItems');list.replaceChildren();let items=history?records.filter(matching).sort((a,b)=>b.start.localeCompare(a.start)):forDay(selected);if(!items.length)list.append(el('p','muted','등록된 기록이 없습니다.'));items.forEach(r=>{const b=el('button','entry');const tag=el('span','tag',kinds[r.kind]||'업무');const body=el('span','body');body.append(el('strong','',r.name));body.append(el('small','',`${r.unit==='all'?'전체':r.unit+'호기'} · ${history?r.start+' · ':''}${r.time||'시간 미지정'}${r.details?' · '+r.details.slice(0,22):''}`));b.append(tag,body,el('span','','❯'));b.onclick=()=>openForm(r);list.append(b)});document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('[data-unit]').forEach(b=>b.classList.toggle('active',b.dataset.unit===unitFilter));}function openForm(r,kind){$('recordForm').reset();$('recordId').value=r?.id||'';$('kind').value=r?.kind||kind||'work';$('start').value=r?.start||selected;$('end').value=r?.end||selected;$('unit').value=r?.unit||(unitFilter==='all'||unitFilter==='history'?'all':unitFilter);$('time').value=r?.time||'';$('name').value=r?.name||'';$('details').value=r?.details||'';$('delete').classList.toggle('hidden',!r);$('formTitle').textContent=r?'기록 상세 · 수정':'일정 등록';$('overlay').classList.add('show')};function close(){$('overlay').classList.remove('show')};$('recordForm').onsubmit=e=>{e.preventDefault();const r={id:$('recordId').value||String(Date.now())+'_'+Math.random().toString(36).slice(2),kind:$('kind').value,start:$('start').value,end:$('end').value,unit:$('unit').value,time:$('time').value,name:$('name').value.trim(),details:$('details').value.trim()};if(!r.name||!r.start||!r.end)return alert('필수 항목을 입력해 주세요.');if(r.end<r.start)return alert('종료일은 시작일보다 빠를 수 없습니다.');const before=records.slice();records=records.filter(x=>x.id!==r.id);records.push(r);if(!save()){records=before;return}selected=r.start;view=new Date(Number(r.start.slice(0,4)),Number(r.start.slice(5,7))-1,1);history=false;close();render()};$('delete').onclick=()=>{if(!confirm('이 기록을 삭제할까요?'))return;const before=records.slice();records=records.filter(r=>r.id!==$('recordId').value);if(!save()){records=before;return}close();render()};$('cancel').onclick=close;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('today').onclick=()=>{selected=iso(new Date());view=new Date(new Date().getFullYear(),new Date().getMonth(),1);history=false;render()};$('addDay').onclick=()=>openForm(null,tab==='operation'?'operation':tab==='maintenance'?'maintenance':'work');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm(null,b.dataset.add));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;history=false;render()});document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{unitFilter=b.dataset.unit;history=b.dataset.unit==='history';render()});$('allHistory').onclick=()=>{unitFilter='history';history=true;render();$('dayTitle').scrollIntoView({behavior:'smooth',block:'center'})};
const widgetDate = date => {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(date);
  const value = type => parts.find(part => part.type === type).value;
  return [value('year'), value('month'), value('day')].join('-');
};
const makeSnapshot = () => {
  if (location.protocol !== 'https:') {
    alert('기존 GitHub Pages 주소를 아이폰에서 열고 위젯 업데이트를 눌러 주세요.');
    return;
  }
  const now = Date.now();
  const days = [0, 1, 2].map(offset => {
    const date = widgetDate(new Date(now + offset * 86400000));
    const active = records.filter(r => r.start <= date && date <= r.end && typeof r.name === 'string')
      .sort((a,b) => (a.time || '').localeCompare(b.time || '') || a.start.localeCompare(b.start));
    const items = active.slice(0,3).map(r => ({
      name: Array.from(r.name).slice(0,7).join(''),
      kind: Object.hasOwn(kinds,r.kind) ? r.kind : 'work',
      unit: /^[1-4]$/.test(r.unit) ? String(r.unit) : 'all',
      time: /^\d{2}:\d{2}$/.test(r.time) ? r.time : ''
    }));
    return {date, items, more: active.length - items.length};
  });
  return JSON.stringify({version: 1, url: location.origin + location.pathname, days});
};
$('updateWidget').onclick = () => {
  const snapshot = makeSnapshot();
  if (!snapshot) return;
  location.href = 'scriptable:///run/' + encodeURIComponent('소각로 위젯') + '?snapshot=' + encodeURIComponent(snapshot);
};
$('copySnapshot').onclick = async () => {
  const snapshot = makeSnapshot();
  if (!snapshot) return;
  try {
    await navigator.clipboard.writeText(snapshot);
    alert('일정을 복사했습니다. Scriptable에서 소각로 위젯을 실행하고 복사한 일정을 붙여넣으세요.');
  } catch (_) {
    prompt('아래 내용을 모두 복사하세요.', snapshot);
  }
};
$('copyWidget').onclick = async () => {
  try {
    const code = fetch('./incinerator-widget.js').then(async response => {
      if (!response.ok) throw Error();
      const source = await response.text();
      if (!source.startsWith('// Scriptable')) throw Error();
      return new Blob([source], {type: 'text/plain'});
    });
    await navigator.clipboard.write([new ClipboardItem({'text/plain': code})]);
    alert('복사했습니다. Scriptable의 새 스크립트에 붙여넣으세요.');
  } catch (_) {
    alert('코드를 복사하지 못했습니다. ZIP 안의 incinerator-widget.js 파일을 열어 코드를 복사하세요.');
  }
};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render()})();
</script></body></html>
